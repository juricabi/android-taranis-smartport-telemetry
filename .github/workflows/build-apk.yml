name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'storeFile=../debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > keystore.properties

      - name: Install SDK platform 28
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;29.0.2" "ndk;21.4.7075529"

      - name: Write local.properties
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/21.4.7075529"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$NDK_DIR" >> local.properties
          cat local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-ghst-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
