name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8 will not run on anything below 17, and 21 is what this is built
      # with by hand, so a CI failure can be reproduced without guessing which
      # JDK caused it.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            cat > keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          else
            echo "No signing secret set, generating a throwaway key"
            keytool -genkeypair -v -keystore app/release.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            printf 'storeFile=release.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > keystore.properties
          fi

      # Before the APK is built, so a broken decoder, a wrong log offset or a
      # reconnect contract that has drifted stops the build rather than shipping.
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          VER=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "telemetry-$VER.apk"
          ls -la telemetry-*.apk

      # The debug build installs beside the release (its id ends .debug) and
      # is the one that writes the diagnostics "Copy debug info" copies — a
      # field problem gets reproduced on it and the notes sent back. Kept in
      # its own directory so the release-publish glob below never ships it.
      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          mkdir -p debug-apk
          cp app/build/outputs/apk/debug/app-debug.apk debug-apk/telemetry-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-ghst-apk
          path: telemetry-*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-debug-apk
          path: debug-apk/telemetry-debug.apk
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: telemetry-*.apk
