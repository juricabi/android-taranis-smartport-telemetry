apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.protobuf'


def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    // Keep this level with the MapLibre build we link our custom GL layer to.
    // The layer draws the aircraft and its three moving lines inside
    // MapLibre's own render pass, instead of asking a GeoJSON worker to
    // retile them independently.
    ndkVersion '28.2.13676358'

    signingConfigs {
        main {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    // What the R class and BuildConfig are generated into. Level with the
    // applicationId below, which it has never been: the code sat in
    // crazydude's package and the phone installed it as jauler's, and this has
    // been neither of those for a long time.
    namespace 'juricabi.com.telemetry'
    compileSdk 35
    defaultConfig {
        applicationId "juricabi.com.telemetry"
        // MapLibre v13, used by the custom renderer, requires Android 6.
        minSdk 23
        // Deliberately behind compileSdk. Compiling against 35 is what the
        // newer AndroidX libraries require; targeting it is a separate job —
        // scoped storage for the logs, foreground service types for the one
        // that records with the screen away, the notification permission, and
        // foregroundServiceType="camera" should video ever run from the
        // service rather than the screen — and none of that is owed while
        // this is handed out as an APK rather than through a store.
        targetSdk 28
        versionCode 66
        versionName "2.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // MapLibre is a native renderer and ships a copy for every
            // architecture: four of them, twenty megabytes of the APK, where
            // this was under five in total before it arrived. The two ARM ones
            // are every phone and tablet anybody flies with; the two x86 ones
            // are emulators, which is not where this app is ever tested — it
            // needs a radio, a link and somewhere to fly.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }
    buildFeatures {
        // Off by default since AGP 8, and the settings screen puts
        // BuildConfig.VERSION_NAME in its title.
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.main
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.main
        }
    }

	compileOptions {
		sourceCompatibility javaSourceCompatibility
		targetCompatibility javaTargetCompatibility
	}

    kotlinOptions {
        // Kept level with compileOptions above; AGP 8 fails the build where the
        // two disagree rather than quietly picking one.
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }

    sourceSets {
        main {
            proto {
                srcDir 'src/main/proto'
            }
        }
    }

    testOptions {
        // Robolectric stands up an Android runtime on the JVM — no device,
        // which is where this app is never tested anyway. It needs the merged
        // manifest and resources on the unit-test classpath to do it.
        unitTests {
            includeAndroidResources = true
        }
    }
}


protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.12'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // 1.6.1 because UVCAndroid below asks for it and Gradle would resolve to
    // it anyway; pinned here so the build file says what is actually built.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    // androidx.test excluded: 3.4.6 wrongly declares it as a runtime
    // dependency, and its manifest merged three exported test activities
    // and REORDER_TASKS into the shipping APK
    implementation('com.github.mik3y:usb-serial-for-android:3.4.6') {
        exclude group: 'androidx.test'
    }
    implementation 'com.nex3z:flow-layout:1.3.0'
    implementation 'com.github.deano2390:MaterialShowcaseView:1.3.4'
    // Drawn by the GPU, so a flight line costs the same however many points
    // are in it. It replaced osmdroid, which was archived in November 2024.
    implementation 'org.maplibre.gl:android-sdk-opengl:13.4.1'
    // Video. UVCAndroid drives USB (UVC) receivers and goggles over OTG —
    // it replaced the 2014 serenegiant module chain this repo used to carry.
    // Ours is the published 1.0.13 rebuilt with UVC 1.5 accepted, without
    // which a modern camera's webcam mode (DJI's among them) fails every
    // open as "code=1 unknown error"; tools/uvcandroid-uvc15.patch holds
    // the diff and the rebuild line. A local AAR carries no dependency
    // list of its own, so the library's one runtime need the rest of this
    // file does not already provide is stated below it. Media3 speaks RTSP
    // for network video; 1.8.x is the last line built against compileSdk
    // 35, and 1.9+ tracks Android 16 — do not bump it ahead of compileSdk.
    implementation files('libs/UVCAndroid-1.0.13-uvc15.aar')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.8.0'
    // turns the RTSP picture for a sideways camera: a SurfaceView cannot be
    // rotated at the view, so the player rotates it through this GL effect —
    // engaged only at a non-zero turn, so an upright feed stays the plain
    // fast overlay
    implementation 'androidx.media3:media3-effect:1.8.0'
    implementation 'androidx.media3:media3-common:1.8.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    testImplementation 'junit:junit:4.13.2'
    // Robolectric: an Android runtime on the JVM for the SharedPreferences,
    // Environment and Service-backed logic that a plain JUnit test cannot reach.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
	implementation 'com.google.android:flexbox:2.0.1'
}
