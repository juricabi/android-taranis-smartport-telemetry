apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.protobuf'


def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    signingConfigs {
        main {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    // What the R class and BuildConfig are generated into, and what the manifest
    // used to declare as its package. The applicationId below is what the phone
    // installs it as, and the two have never been the same here.
    namespace 'crazydude.com.telemetry'
    compileSdk 35
    defaultConfig {
        applicationId "jauler.com.telemetry"
        minSdk 21
        // Deliberately behind compileSdk. Compiling against 35 is what the
        // newer AndroidX libraries require; targeting it is a separate job —
        // scoped storage for the logs, foreground service types for the one
        // that records with the screen away, the notification permission — and
        // none of that is owed while this is handed out as an APK rather than
        // through a store.
        targetSdk 28
        versionCode 48
        versionName "2.0.23"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        // Off by default since AGP 8, and the settings screen puts
        // BuildConfig.VERSION_NAME in its title.
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.main
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.main
        }
    }

	compileOptions {
		sourceCompatibility javaSourceCompatibility
		targetCompatibility javaTargetCompatibility
	}

    kotlinOptions {
        // Kept level with compileOptions above; AGP 8 fails the build where the
        // two disagree rather than quietly picking one.
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
    }

    sourceSets {
        main {
            proto {
                srcDir 'src/main/proto'
            }
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.12'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'
    implementation 'com.nex3z:flow-layout:1.3.0'
    implementation 'com.github.deano2390:MaterialShowcaseView:1.3.4'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    //testImplementation 'deviandroidx.test:core:1.2.0'
    testImplementation 'org.mockito:mockito-core:1.10.19'
	implementation 'com.google.android:flexbox:2.0.1'
}

